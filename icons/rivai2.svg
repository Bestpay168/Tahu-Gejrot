<svg xmlns="http://www.w3.org/2000/svg"
     width="700"
     height="700"
     viewBox="0 0 700 700">

  <defs>
    <linearGradient id="orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="10" stdDeviation="8"
        flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Lingkaran Oranye -->
  <circle
      cx="350"
      cy="350"
      r="310"
      fill="url(#orange)"
      stroke="#E67E00"
      stroke-width="14"
      filter="url(#shadow)"/>

  <!-- Panel Hitam -->
  <ellipse
      cx="350"
      cy="350"
      rx="235"
      ry="165"
      fill="#1B1B1B"
      stroke="#FFB300"
      stroke-width="10"/>

  <!-- RIVAI -->
  <text
      x="350"
      y="365"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Arial Black, Impact, sans-serif"
      font-size="110"
      font-weight="900"
      fill="#FFFFFF"
      stroke="#000000"
      stroke-width="10"
      paint-order="stroke fill"
      letter-spacing="3">
      RIVAI
  </text>

  <!-- Garis Dekorasi -->
  <path
      d="M180 470 Q350 530 520 470"
      fill="none"
      stroke="#FFD54F"
      stroke-width="8"
      stroke-linecap="round"/>

</svg>