<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">

  <defs>
    <linearGradient id="orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="10" stdDeviation="6"
        flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Badge -->
  <rect
    x="40"
    y="40"
    rx="40"
    ry="40"
    width="820"
    height="240"
    fill="#1B1B1B"
    stroke="url(#orange)"
    stroke-width="14"
    filter="url(#shadow)"/>

  <!-- RIVAI -->
  <text
    x="450"
    y="182"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Arial Black, Impact, sans-serif"
    font-size="120"
    font-weight="900"
    fill="#FFFFFF"
    stroke="#000000"
    stroke-width="10"
    paint-order="stroke fill"
    letter-spacing="2">
    RIVAI
  </text>

  <!-- Garis dekorasi -->
  <line
    x1="90"
    y1="230"
    x2="810"
    y2="230"
    stroke="#FFB300"
    stroke-width="6"
    opacity="0.7"/>

</svg>